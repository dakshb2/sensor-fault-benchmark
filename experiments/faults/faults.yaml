# Fault definitions for the sensor-fault-benchmark.
#
# ONE file, all sensors, all fault types. A run selects a fault per sensor on
# the command line, e.g.
#     ./run_trial.sh figure_eight.yaml trial01 --imu yaw_bias:0.2
#     ./run_trial.sh figure_eight.yaml trial02 --imu yaw_bias:0.2 --wheel dropout
# Any sensor not named runs clean. No flags at all = fully clean run.
#
# Timing is in SIMULATION seconds, measured from the moment the trajectory
# starts (signalled by /trial/started), NOT from simulator startup.
#   start:    when the fault begins
#   duration: how long it lasts; null means "until the run ends"
#
# default_magnitude is used when the command line names a fault without a
# value. It is recorded here (not generated at runtime) so every run remains
# reproducible. Faults with no magnitude use null.

imu:
  topic_raw: /imu/raw
  topic_out: /imu

  yaw_bias:
    description: Constant offset added to angular_velocity.z, in rad/s.
    default_magnitude: 0.1
    start: 8.0
    duration: null
  
  drift:
    description: Yaw-rate bias that grows linearly with time (rad/s per second).
    default_magnitude: 0.02
    start: 8.0
    duration: null

wheel:
  topic_raw: /wheel/odometry/raw
  topic_out: /wheel/odometry

  dropout:
    description: Stop republishing wheel odometry entirely for the window.
    default_magnitude: null
    start: 12.0
    duration: 3.0
  
  freeze:
    description: Republish the last wheel odometry value with fresh timestamps.
    default_magnitude: null
    start: 12.0
    duration: 15.0
  
  slip:
    description: Scale reported forward velocity by a factor (<1 under, >1 over).
    default_magnitude: 0.5
    start: 12.0
    duration: null